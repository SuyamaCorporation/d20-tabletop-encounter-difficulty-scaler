<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D5e エンカウンター難易度スケーラー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-red-300 mb-1">🎲 エンカウンター難易度スケーラー</h1>
  <p class="text-center text-gray-500 mb-4 text-sm">D&D 5e準拠 戦闘難易度・経験値予算リアルタイム計算</p>

  <!-- PC Settings -->
  <div class="bg-gray-800 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-red-300 mb-3">プレイヤーキャラクター（PC）設定</h2>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-gray-400 block mb-1">PCの人数</label>
        <input type="number" id="pc-count" value="4" min="1" max="8" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1">PCのレベル</label>
        <input type="number" id="pc-level" value="5" min="1" max="20" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
    </div>
  </div>

  <!-- Enemy Settings -->
  <div class="bg-gray-800 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-red-300 mb-3">敵モンスター設定</h2>
    <div id="enemy-list" class="space-y-2 mb-3"></div>
    <button onclick="addEnemy()" class="w-full py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm rounded-lg border border-dashed border-gray-600" aria-label="敵を追加">+ 敵を追加</button>
  </div>

  <!-- Results -->
  <div id="results" class="bg-gray-800 rounded-xl p-4 mb-4"></div>

  <!-- Recommended CRs -->
  <div class="bg-gray-800 rounded-xl p-4">
    <h2 class="text-sm font-semibold text-red-300 mb-3">推奨モンスターCR範囲</h2>
    <div id="recommended-cr" class="grid grid-cols-4 gap-2"></div>
  </div>
</div>

<script>
// XP thresholds per level per PC [easy, medium, hard, deadly]
const xpThresholds = {
  1:[25,50,75,100], 2:[50,100,150,200], 3:[75,150,225,400], 4:[125,250,375,500],
  5:[250,500,750,1100], 6:[300,600,900,1400], 7:[350,750,1100,1700], 8:[450,900,1400,2100],
  9:[550,1100,1600,2400], 10:[600,1200,1900,2800], 11:[800,1600,2400,3600],
  12:[1000,2000,3000,4500], 13:[1100,2200,3400,5100], 14:[1250,2500,3800,5700],
  15:[1400,2800,4300,6400], 16:[1600,3200,4800,7200], 17:[2000,3900,5900,8800],
  18:[2100,4200,6300,9500], 19:[2400,4900,7300,11000], 20:[2800,5700,8500,12700],
};

// CR to XP
const crXP = {
  '0':10,'1/8':25,'1/4':50,'1/2':100,'1':200,'2':450,'3':700,'4':1100,'5':1800,
  '6':2300,'7':2900,'8':3900,'9':5000,'10':5900,'11':7200,'12':8400,'13':10000,
  '14':11500,'15':13000,'16':15000,'17':18000,'18':20000,'19':22000,'20':25000,
  '21':33000,'22':41000,'23':50000,'24':62000,'30':155000,
};

const crValues = Object.keys(crXP);
let enemies = [{cr:'1', count:1}];
let enemyId = 0;

function addEnemy() {
  enemies.push({id:++enemyId, cr:'1', count:1});
  renderEnemies();
  calculate();
}
function removeEnemy(idx) {
  enemies.splice(idx,1);
  renderEnemies();
  calculate();
}
function updateEnemy(idx, field, val) {
  enemies[idx][field] = field==='count'?parseInt(val):val;
  calculate();
}

function renderEnemies() {
  const el = document.getElementById('enemy-list');
  el.innerHTML = enemies.map((e,i) => `
    <div class="flex gap-2 items-center">
      <span class="text-xs text-gray-500 w-4">${i+1}</span>
      <div class="flex-1">
        <label class="text-xs text-gray-500">CR</label>
        <select onchange="updateEnemy(${i},'cr',this.value)" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-white mt-0.5" aria-label="CR値">
          ${crValues.map(c=>`<option value="${c}" ${e.cr===c?'selected':''}>${c} (${crXP[c].toLocaleString()} XP)</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500">体数</label>
        <input type="number" value="${e.count}" min="1" max="20" onchange="updateEnemy(${i},'count',this.value)" class="w-16 bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-white mt-0.5" aria-label="モンスターの数">
      </div>
      <button onclick="removeEnemy(${i})" class="text-red-400 hover:text-red-300 text-lg mt-4" aria-label="削除">×</button>
    </div>
  `).join('');
}

function getMultiplier(numMonsters) {
  if (numMonsters === 1) return 1;
  if (numMonsters === 2) return 1.5;
  if (numMonsters <= 6) return 2;
  if (numMonsters <= 10) return 2.5;
  if (numMonsters <= 14) return 3;
  return 4;
}

function calculate() {
  const pcCount = parseInt(document.getElementById('pc-count').value)||4;
  const pcLevel = Math.min(20, Math.max(1, parseInt(document.getElementById('pc-level').value)||5));
  const thresholds = xpThresholds[pcLevel];
  const partyThresholds = thresholds.map(t => t * pcCount);

  // Calculate total adjusted XP
  let rawXP = 0;
  let numMonsters = 0;
  enemies.forEach(e => {
    rawXP += (crXP[e.cr]||0) * e.count;
    numMonsters += e.count;
  });
  const multiplier = getMultiplier(numMonsters);
  const adjustedXP = Math.round(rawXP * multiplier);

  // Difficulty
  let diff = 'なし';
  let diffColor = 'text-gray-400';
  let diffBg = 'bg-gray-700';
  if (adjustedXP >= partyThresholds[3]) { diff='DEADLY 🔥'; diffColor='text-red-300'; diffBg='bg-red-900/50'; }
  else if (adjustedXP >= partyThresholds[2]) { diff='HARD ⚔️'; diffColor='text-orange-300'; diffBg='bg-orange-900/50'; }
  else if (adjustedXP >= partyThresholds[1]) { diff='MEDIUM ⚠️'; diffColor='text-yellow-300'; diffBg='bg-yellow-900/50'; }
  else if (adjustedXP >= partyThresholds[0]) { diff='EASY 😊'; diffColor='text-green-300'; diffBg='bg-green-900/50'; }

  const pct = Math.min(100, (adjustedXP / partyThresholds[3]) * 100);

  document.getElementById('results').innerHTML = `
    <div class="text-center mb-3">
      <div class="${diffBg} rounded-xl py-3 mb-2">
        <div class="text-3xl font-bold ${diffColor}">${diff}</div>
        <div class="text-sm text-gray-400">難易度判定</div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 text-sm mb-3">
      <div class="bg-gray-700 rounded-lg p-2"><div class="text-xs text-gray-400">生XP合計</div><div class="font-bold font-mono">${rawXP.toLocaleString()}</div></div>
      <div class="bg-gray-700 rounded-lg p-2"><div class="text-xs text-gray-400">調整済XP (×${multiplier})</div><div class="font-bold font-mono text-yellow-300">${adjustedXP.toLocaleString()}</div></div>
      <div class="bg-gray-700 rounded-lg p-2"><div class="text-xs text-gray-400">モンスター数</div><div class="font-bold font-mono">${numMonsters}体</div></div>
      <div class="bg-gray-700 rounded-lg p-2"><div class="text-xs text-gray-400">倍率</div><div class="font-bold font-mono">×${multiplier}</div></div>
    </div>
    <div class="mb-2">
      <div class="text-xs text-gray-400 mb-1">XP閾値（DEADLY基準との比較）</div>
      <div class="h-3 bg-gray-700 rounded-full overflow-hidden">
        <div class="h-full rounded-full transition-all" style="width:${pct}%;background:${adjustedXP>=partyThresholds[3]?'#ef4444':adjustedXP>=partyThresholds[2]?'#f97316':adjustedXP>=partyThresholds[1]?'#eab308':'#22c55e'}"></div>
      </div>
    </div>
    <div class="grid grid-cols-4 gap-1 text-xs text-center">
      <div class="text-green-400">EASY<br>${partyThresholds[0].toLocaleString()}</div>
      <div class="text-yellow-400">MEDIUM<br>${partyThresholds[1].toLocaleString()}</div>
      <div class="text-orange-400">HARD<br>${partyThresholds[2].toLocaleString()}</div>
      <div class="text-red-400">DEADLY<br>${partyThresholds[3].toLocaleString()}</div>
    </div>
  `;

  // Recommended CR
  const targetXPPerMonster = partyThresholds[1] / 2; // medium for 2 monsters
  document.getElementById('recommended-cr').innerHTML = [
    {label:'EASY向き', xp: partyThresholds[0]/2},
    {label:'MEDIUM向き', xp: partyThresholds[1]/2},
    {label:'HARD向き', xp: partyThresholds[2]/2.5},
    {label:'DEADLY向き', xp: partyThresholds[3]/3},
  ].map(t => {
    const cr = crValues.reduce((best, c) => Math.abs(crXP[c]-t.xp) < Math.abs(crXP[best]-t.xp) ? c : best, '1');
    return `<div class="bg-gray-700 rounded-lg p-2 text-center text-xs"><div class="text-gray-400">${t.label}</div><div class="font-bold text-white">CR ${cr}</div><div class="text-gray-500">${crXP[cr]?.toLocaleString()} XP</div></div>`;
  }).join('');
}

renderEnemies();
calculate();
</script>
</body>
</html>
